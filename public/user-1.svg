<?xml version="1.0" encoding="utf-8"?>
<!-- Modifikasi Adaptif Mode Terang / Gelap -->
<svg width="148px" height="148px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Default warna hitam untuk mode terang */
    .avatar-path {
      stroke: #000000;
    }

    /* Otomatis berubah menjadi putih saat sistem atau browser mendeteksi mode gelap */
    @media (prefers-color-scheme: dark) {
      .avatar-path {
        stroke: #8C8C94;
      }
    }
  </style>
  
